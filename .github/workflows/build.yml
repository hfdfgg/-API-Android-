name: 构建与发布 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压源码并定位目录
        run: |
          ZIP_FILE=$(ls *率土战情*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
             ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
            echo "定位成功: $PROJECT_DIR"
          fi

      - name: 自动修复源码中的语法报错
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "==== 开始使用 Python 脚本精准修复代码 ===="
          
          python3 - << 'EOF'
          import os

          # 修复 AppState.kt 的变量捕获问题
          appstate_path = 'app/src/main/java/com/zsm/terminal/AppState.kt'
          if os.path.exists(appstate_path):
              with open(appstate_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # 还原上一步的激进修改
              content = content.replace('webRef.get()?.evaluateJavascript', 'evaluateJavascript')
              # 提前取出局部变量避免 Smart Cast 报错
              content = content.replace('webRef?.get()?.post {', 'val w = webRef?.get() ?: return\n        w.post {')
              content = content.replace('try { evaluateJavascript', 'try { w.evaluateJavascript')
              with open(appstate_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 修复 SettingsView.kt 的变量捕获问题
          settingsview_path = 'app/src/main/java/com/zsm/terminal/SettingsView.kt'
          if os.path.exists(settingsview_path):
              with open(settingsview_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('logRef?.get()?.post { logRef.get()?.text = buffer.toString() }', 
                                        'val tv = logRef?.get() ?: return\n        tv.post { tv.text = buffer.toString() }')
              with open(settingsview_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("源码修复完毕！")
          EOF

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境及 NDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          
      - name: 预装 NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: 执行构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          echo "正在生成包装器..."
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          
          echo "开始编译..."
          ./gradlew assembleDebug

      - name: 自动发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 率土战情终端 Release ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
