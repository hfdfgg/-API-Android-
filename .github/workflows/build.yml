name: 构建与发布 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      with_llama:
        description: '是否编译 llama.cpp 真机推理引擎 (选 true)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压源码并定位目录
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 zip 文件，假设代码已在根目录。"
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            echo "找到压缩包: $ZIP_FILE，开始解压..."
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted || unzip -q "$ZIP_FILE" -d extracted
            GRADLEW_PATH=$(find extracted -name "gradlew" | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "::error::解压后未找到 gradlew 文件。"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          fi

      # 🌟 魔法补丁 1：修复 C++ 报错 + 注入法拉利级硬件加速指令
      - name: 自动修复并注入 CPU 极速指令集
        if: ${{ inputs.with_llama }}
        run: |
          # 1. 修复旧版接口报错
          JNI_FILE=$(find ${{ env.PROJECT_DIR }} -name "llama_jni.cpp" | head -n 1)
          if [ -n "$JNI_FILE" ]; then
            sed -i 's/mp.use_mmap = true;/\/\/ mp.use_mmap = true;/g' "$JNI_FILE"
            sed -i 's/mp.use_mlock = false;/\/\/ mp.use_mlock = false;/g' "$JNI_FILE"
            echo "✅ llama_jni.cpp 已修复"
          fi

          # 2. 注入 armv8 硬件加速指令 (针对骁龙/天玑的终极提速)
          CMAKE_FILE=$(find ${{ env.PROJECT_DIR }} -path "*native-llama/CMakeLists.txt" | head -n 1)
          if [ -n "$CMAKE_FILE" ]; then
            echo "找到 CMakeLists.txt: $CMAKE_FILE，注入极速编译参数..."
            # 在文件开头注入编译参数
            sed -i '1i set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -O3 -march=armv8.2-a+dotprod+fp16+i8mm")' "$CMAKE_FILE"
            sed -i '1i set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -march=armv8.2-a+dotprod+fp16+i8mm")' "$CMAKE_FILE"
            echo "✅ 硬件加速参数注入完成！"
          else
            echo "⚠️ 未找到 native-llama/CMakeLists.txt，跳过注入。"
          fi

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: 准备 NDK
        if: ${{ inputs.with_llama }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 执行构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug ${{ inputs.with_llama && '-PwithLlama=true' || '' }}

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 极速版 Release ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
