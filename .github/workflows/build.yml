name: 构建与验证

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 🌟 新增：自动解压源码包
      - name: 解压源码包
        run: |
          mkdir project
          unzip source.zip -d project
          ls -la project # 打印解压后的目录结构，方便排查问题

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境
        uses: android-actions/setup-android@v3

      # 🌟 注意：这里指定了解压后的目录
      - name: 构建 Debug APK
        working-directory: ./project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 🌟 注意：提取路径变了
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LocalModelAPI-APP
          path: project/app/build/outputs/apk/debug/app-debug.apk
