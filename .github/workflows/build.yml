name: 构建与发布 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压源码并定位目录
        run: |
          ZIP_FILE=$(ls *率土战情*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
             ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
            echo "定位成功: $PROJECT_DIR"
          fi

      - name: 自动修复源码中的语法报错
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "==== 开始修复原作者的代码 Bug ===="
          
          # 1. 修复 OverlayManager.kt 的 x 变量冲突
          sed -i 's/x = Design.dp(ctx, 8); y = Design.dp(ctx, 120)/this.x = Design.dp(ctx, 8); this.y = Design.dp(ctx, 120)/g' app/src/main/java/com/zsm/terminal/OverlayManager.kt || true
          
          # 2. 修复 SettingsView.kt 的 it 未定义
          sed -i 's/logRef?.get()?.post { it.text = buffer.toString() }/logRef?.get()?.post { logRef.get()?.text = buffer.toString() }/g' app/src/main/java/com/zsm/terminal/SettingsView.kt || true
          
          # 3. 修复 MainActivity.kt 的 Settings 类型不匹配
          sed -i 's/JsBridge(settings,/JsBridge(this@MainActivity.settings,/g' app/src/main/java/com/zsm/terminal/MainActivity.kt || true
          
          # 4. 修复 AppState.kt 的 evaluateJavascript 缺失 WebView 上下文
          sed -i 's/evaluateJavascript(/webRef.get()?.evaluateJavascript(/g' app/src/main/java/com/zsm/terminal/AppState.kt || true
          
          echo "==== 修复完毕，准备编译 ===="

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境及 NDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          
      - name: 预装 NDK (防止 C++ 编译报错)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: 执行构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          echo "正在使用 Gradle 8.9 生成包装器..."
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          
          echo "开始编译..."
          ./gradlew assembleDebug --stacktrace

      - name: 自动发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 率土战情终端 Release ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
