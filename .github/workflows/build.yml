name: 构建与发布 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压源码并定位目录
        run: |
          ZIP_FILE=$(ls *率土战情*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
             ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 zip 文件，假设代码已在根目录。"
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            echo "找到压缩包: $ZIP_FILE，开始解压..."
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::解压后未找到 settings.gradle 文件，请确认压缩包内容。"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
            echo "已定位工程目录: $PROJECT_DIR"
          fi

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: 执行构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "正在使用 Gradle 8.9 版本生成包装器..."
          # 关键修改：升级到 8.9 满足项目要求
          gradle wrapper --gradle-version 8.9
          
          echo "开始编译..."
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 自动发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 率土战情终端 Release ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
