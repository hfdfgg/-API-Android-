name: 构建与发布 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      with_llama:
        description: '是否编译 llama.cpp 真机推理引擎 (默认否，编译较慢)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压源码并定位目录
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 zip 文件，假设代码已在根目录。"
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            echo "找到压缩包: $ZIP_FILE，开始解压..."
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted || unzip -q "$ZIP_FILE" -d extracted
            GRADLEW_PATH=$(find extracted -name "gradlew" | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "::error::解压后未找到 gradlew 文件，请检查压缩包内是否包含完整的 Android 源码。"
              ls -R extracted
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "成功定位项目根目录: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          fi

      # 🌟 新增：自动修复 C++ 接口不兼容问题
      - name: 自动打补丁修复 llama_jni.cpp
        if: ${{ inputs.with_llama }}
        run: |
          JNI_FILE=$(find ${{ env.PROJECT_DIR }} -name "llama_jni.cpp" | head -n 1)
          if [ -n "$JNI_FILE" ]; then
            echo "找到文件: $JNI_FILE，正在应用修复补丁..."
            # 将旧的 use_mmap 和 use_mlock 注释掉（新版 llama.cpp 已移除这些字段）
            sed -i 's/mp.use_mmap = true;/\/\/ mp.use_mmap = true;/g' "$JNI_FILE"
            sed -i 's/mp.use_mlock = false;/\/\/ mp.use_mlock = false;/g' "$JNI_FILE"
            echo "补丁应用完成！修改后的相关代码："
            grep -n "use_mmap\|use_mlock" "$JNI_FILE" || true
          else
            echo "未找到 llama_jni.cpp，跳过补丁。"
          fi

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android 环境
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: 准备 NDK (仅在勾选 with_llama 时执行)
        if: ${{ inputs.with_llama }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 执行构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug ${{ inputs.with_llama && '-PwithLlama=true' || '' }}

      - name: 上传到 Actions 产物 (作为备份)
        uses: actions/upload-artifact@v4
        with:
          name: LocalModelAPI-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 自动构建 Release ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
